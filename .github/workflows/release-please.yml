name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # Release Please cuts the tag the moment the release PR merges, so this is the
  # last point where a red main can still stop a release.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync
      - name: Run pytest
        run: uv run -m pytest

  release-please:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Not GITHUB_TOKEN: GitHub refuses to run workflows from events that token
      # creates, so the release PR would never run Validate and could never
      # satisfy the required `build` check.  Not a personal token either: its owner
      # becomes the release PR's author, and GitHub won't let an author approve.
      # GitHub accepts the App ID where `client-id` asks for the Client ID.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.MCC_LAB_AGENT_APP_ID }}
          private-key: ${{ secrets.MCC_LAB_AGENT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      # The sha Release Please released, not the tag name: it is the job's own output,
      # so the build does not depend on when the tag appears.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Set up Python
        run: uv python install 3.14
      - name: Build
        run: uv build
      # Releases are immutable once published, so the assets must go on while the
      # release is still a draft.
      - name: Attach the build, then publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          ls dist/*.whl dist/*.tar.gz
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json isDraft,assets \
            --jq 'if .isDraft or (.assets | length) == 0
                  then error("release published without assets") else "published with \(.assets|length) assets" end'
